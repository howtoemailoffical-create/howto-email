name: Header Analyzer QA

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/tools/header-analyzer.astro'
      - 'src/lib/header-trace.js'
      - 'src/lib/header-dns.js'
      - 'src/lib/diagnostic-findings.js'
      - 'tests/header-diagnostics.test.mjs'
      - 'package.json'
      - '.github/workflows/header-analyzer-qa.yml'
  pull_request:
    paths:
      - 'src/pages/tools/header-analyzer.astro'
      - 'src/lib/header-trace.js'
      - 'src/lib/header-dns.js'
      - 'src/lib/diagnostic-findings.js'
      - 'tests/header-diagnostics.test.mjs'
      - 'package.json'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm run test:headers
      - name: Astro production build
        run: npm run build
